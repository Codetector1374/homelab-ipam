# EXAMPLE ONLY: replace every value; do not commit real credentials.
# Prefer your cluster's external-secret integration or create the Secret directly.
# Kubernetes Secrets are base64-encoded, not encrypted by default; enable API
# server encryption at rest and restrict RBAC. Use the same namespace as the app.
# Issuer discovery URL is OIDC_ISSUER + /.well-known/openid-configuration.
apiVersion: v1
kind: Secret
metadata:
  name: homelab-ipam-oidc
type: Opaque
stringData:
  PUBLIC_URL: https://ipam.example.com
  OIDC_ISSUER: https://idm.example.com/oauth2/openid/ipam
  OIDC_CLIENT_ID: ipam
  OIDC_CLIENT_SECRET: REPLACE_WITH_KANIDM_BASIC_SECRET
